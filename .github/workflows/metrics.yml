name: Metrics
on:
  # Ejecución automática todas las noches a medianoche (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutar la acción manualmente cuando quieras
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # OBLIGATORIO: Permite al bot guardar el gráfico en tu repo
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ShinobiDev79
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Madrid
