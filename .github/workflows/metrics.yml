name: Metrics
on:
  # Ejecución automática todas las noches a medianoche (00:00 UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutar la acción manualmente cuando quieras
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # OBLIGATORIO: Permite al bot guardar el gráfico en tu repo
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ShinobiDev79
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Madrid
          
          # --- PLUGINS ACTIVADOS ---
          # 1. Vista Isométrica de Contribuciones (plugin_isocalendar) Transforma el panel verdoso tradicional de contribuciones de GitHub en un mapa 3D en perspectiva isométrica estilo bloques.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 2. Hábitos de Programación (plugin_habits) Analiza tus commits recientes para mostrar gráficos sobre las horas del día y días de la semana en los que estás más activo escribiendo código, tus hábitos de indentación y estadísticas de racha.
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 3. Desglose Avanzado de Lenguajes (plugin_languages) Genera una barra detallada con los lenguajes que más utilizas, el porcentaje que representa cada uno y el volumen en bytes o líneas escritas.
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # 4. Sistema de Logros y Desafíos (plugin_achievements) Añade medallas y medidores estilo videojuego basados en tus hitos dentro de GitHub (proyectos creados, variedad de lenguajes o uso de la plataforma).
          plugin_achievements: yes
          plugin_achievements_display: compact

          # 5. Registro de Líneas de Código (plugin_lines) Calcula el acumulado total de líneas de código añadidas y eliminadas en todos tus proyectos.
          plugin_lines: yes
          
